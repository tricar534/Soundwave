services:
  postgres:
    image: postgres:18.6
    container_name: soundwaves-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - soundwaves_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  soundwaves_postgres_data:
