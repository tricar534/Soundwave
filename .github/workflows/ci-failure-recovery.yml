
name: SW-167 CI Failure and Recovery Test

on:
  push:
    branches:
      - sw-167-ci-failure-recovery

  pull_request:
    branches:
      - main

jobs:
  failure-recovery-test:
    name: Controlled CI Failure and Recovery
    runs-on: ubuntu-latest

    env:
      SIMULATE_FAILURE: "true"

    steps:
      - name: Run controlled CI validation
        id: validation
        shell: bash
        run: |
          echo "Starting SW-167 controlled CI test..."

          if [[ "$SIMULATE_FAILURE" == "true" ]]; then
            echo "::error::Intentional SW-167 failure simulation."
            exit 1
          fi

          echo "CI validation completed successfully."

      - name: Report test outcome
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        shell: bash
        run: |
          echo "## SW-167 CI Failure and Recovery Test" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Simulation mode: $SIMULATE_FAILURE" >> "$GITHUB_STEP_SUMMARY"
          echo "Validation result: $VALIDATION_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
