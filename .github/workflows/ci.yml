name: Soundwave CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  repository-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project directories
        run: |
          test -d frontend
          test -d backend
          test -d database
          test -d docs

      - name: Verify README
        run: test -f README.md

  integration-smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: soundwaves
          POSTGRES_USER: soundwaves_dev
          POSTGRES_PASSWORD: change_me
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U soundwaves_dev -d soundwaves"
          --health-interval=5s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply migrations
        working-directory: database
        run: |
          npm ci
          DATABASE_URL="postgresql://soundwaves_dev:change_me@localhost:5432/soundwaves?schema=public" npm run db:deploy

      - name: Build and start backend
        working-directory: backend
        run: |
          npm ci
          npm run build
          node dist/index.js &
          sleep 3

      - name: Call health endpoint
        run: curl -f http://localhost:4000/health || exit 1