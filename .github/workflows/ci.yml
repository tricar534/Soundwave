name: Soundwave CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:

  repository-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project directories
        run: |
          test -d frontend
          test -d backend
          test -d database
          test -d docs

      - name: Verify README
        run: test -f README.md


  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npm test --if-present


  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Run backend tests
        working-directory: backend
        run: npm test --if-present

      - name: Run ESLint
        working-directory: backend
        run: npm run lint


  database:
    name: Database CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install database dependencies
        working-directory: database
        run: npm ci

      - name: Build database project
        working-directory: database
        run: npm run build --if-present

      - name: Run database tests
        working-directory: database
        run: npm test --if-present


  database-health:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: soundwaves
          POSTGRES_USER: soundwaves_dev
          POSTGRES_PASSWORD: change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soundwaves_dev -d soundwaves"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Verify PostgreSQL connection
        env:
          PGPASSWORD: change_me
        run: |
          psql -h localhost -U soundwaves_dev -d soundwaves -c "SELECT 1;"
