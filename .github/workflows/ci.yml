name: Soundwave CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

env:
  BUILD_VERSION: soundwave-build-${{ github.run_number }}

jobs:

  build-info:
    name: Build Information
    runs-on: ubuntu-latest

    steps:
      - name: Display build information
        run: |
          echo "Build: $BUILD_VERSION"
          echo "Commit: $GITHUB_SHA"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Add build information to summary
        run: |
          echo "## Soundwaves Build Information" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Build:** $BUILD_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "**Event:** $GITHUB_EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test --if-present

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Run backend tests
        run: npm test --if-present

  database:
    name: Database CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: database

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: database/package-lock.json

      - name: Install database dependencies
        run: npm ci

      - name: Build database project
        run: npm run build --if-present

      - name: Run database tests
        run: npm test --if-present
