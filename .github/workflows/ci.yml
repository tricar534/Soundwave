name: Soundwave CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  repository-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project directories
        run: |
          test -d frontend
          test -d backend
          test -d database
          test -d docs

      - name: Verify README
        run: test -f README.md