name: Soundwave CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  repository-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project directories
        run: |
          test -d frontend
          test -d backend
          test -d database
          test -d docs

      - name: Verify README
        run: test -f README.md

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  database-migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: soundwaves
          POSTGRES_USER: soundwaves_dev
          POSTGRES_PASSWORD: change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soundwaves_dev -d soundwaves"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: database/package-lock.json

      - name: Install database dependencies
        working-directory: database
        run: npm ci  

      - name: Apply Prisma migrations
        working-directory: database
        env:
          DATABASE_URL: postgresql://soundwaves_dev:change_me@localhost:5432/soundwaves
        run: npm run db:deploy    

      - name: Verify migration status
        working-directory: database
        env:
          DATABASE_URL: postgresql://soundwaves_dev:change_me@localhost:5432/soundwaves
        run: npm run db:status 